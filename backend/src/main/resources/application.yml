# 应用配置
spring:
  application:
    name: airport-vehicle-system
  
  # 环境配置
  profiles:
    active: dev
  
  # Bean定义覆盖配置（解决jpaAuditingHandler冲突）
  main:
    allow-bean-definition-overriding: true
  
  # 数据源配置 - 使用MySQL数据库
  # 重要：使用环境变量配置敏感信息
  # 环境变量：DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:airport_vehicle_system}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:your-database-password}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      use-global-data-source-stat: true
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:your-druid-password}
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    defer-datasource-initialization: false
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  # 缓存配置 - 使用Redis（如果Redis不可用，会自动降级到simple缓存）
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10分钟
      cache-null-values: false
  
  # 禁用Redisson自动配置（使用Spring Data Redis即可）
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfiguration
  
  # WebSocket配置 - 移除端口配置，使用与HTTP相同端口
  websocket:
    path: /ws

  # 邮件配置
  # 系统会自动从数据库的sys_user表中读取用户邮箱地址（email字段）和授权码（email_auth_code字段）并发送邮件
  # 每个用户使用自己的邮箱账号和授权码发送邮件
  # 重要：以下配置为默认SMTP服务器，实际发送时会根据用户邮箱自动选择对应的SMTP服务器
  mail:
    enabled: true  # 是否启用邮件服务
    host: ${MAIL_HOST:smtp.163.com}  # 默认SMTP服务器地址（系统会根据用户邮箱自动选择）
    port: ${MAIL_PORT:465}  # 默认SMTP端口（系统会根据用户邮箱自动选择）
    from-name: ${MAIL_FROM_NAME:机场车辆系统}  # 发信人名称
    properties:
      mail:
        smtp:
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}  # 默认启用SSL
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}  # 默认不启用TLS


# 服务器配置 - 改为常用端口 8080
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 30

# knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    swagger-model-name: 实体类列表
    enable-document-manage: true
    enable-version: true
  # 指定OpenAPI文档的URL
  documents:
    - group: default
      name: 默认接口
      locations: /api/v3/api-docs

# 添加SpringDoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.airport.controller

# 日志配置
logging:
  level:
    com.airport: DEBUG
    org.springframework.beans: ERROR
    org.springframework.context: ERROR
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/airport-vehicle-system.log
    max-size: 100MB
    max-history: 30
  charset:
    console: UTF-8
    file: UTF-8

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true

# JWT配置
# 重要：生产环境必须使用强随机密钥，不要使用默认值
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-change-this-in-production}
  expiration: 86400 # 24小时
  header: Authorization
  prefix: "Bearer "

# 车辆监控配置
vehicle:
  tracking:
    # 位置更新间隔(秒)
    update-interval: 30
    # 位置数据保留天数
    retention-days: 30
  # GPS相关配置
  gps:
    # 坐标系统 (WGS84, GCJ02, BD09)
    coordinate-system: GCJ02
    # 地图提供商 (baidu, gaode, tencent)
    map-provider: baidu

# 调度配置
dispatch:
  # 是否启用自动分配
  auto-assign: true
  # 任务超时时间(分钟)
  task-timeout: 480
  # 最大重试次数
  max-retry: 3

# 地图配置
map:
  provider: baidu
  baidu:
    ak: ${BAIDU_MAP_AK:}  # 百度地图AK（从环境变量读取）
  gaode:
    key: ${GAODE_MAP_KEY:your-gaode-key}
  tencent:
    key: ${TENCENT_MAP_KEY:your-tencent-key}

# 文件上传配置
upload:
  # 上传文件大小限制(MB)
  max-size: 100
  # 允许的文件类型
  allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
  # 上传目录
  path: uploads/

# 系统配置
system:
  # 分页大小
  page-size: 10
  # 文件导出最大条数
  export-max-rows: 10000
  # 系统维护开关
  maintenance-mode: false

# 华为云IoT平台配置（MQTT）
# ⚠️ 重要：使用环境变量配置敏感信息
# 华为云IoT使用动态密码机制，系统会自动根据设备密钥和时间戳生成密码
# Client ID格式: {deviceId}_{deviceType}_{passwordSignatureType}_{timestamp}
# Password: HMAC-SHA256(deviceSecret, timestamp) 的十六进制字符串
# 
# 设备信息读取优先级：
# 1. 环境变量 (HUAWEI_IOT_MQTT_DEVICE_ID, HUAWEI_IOT_MQTT_DEVICE_SECRET)
# 2. 配置文件 (huawei.iot.mqtt.device-id, huawei.iot.mqtt.device-secret)
# 3. 设备密钥文件 (自动从 device-key-path 目录读取)
huawei:
  iot:
    mqtt:
      enabled: ${HUAWEI_IOT_MQTT_ENABLED:false}  # 是否启用MQTT客户端
      broker: ${HUAWEI_IOT_MQTT_BROKER:ssl://64fa0824ea.st1.iotda-device.cn-north-4.myhuaweicloud.com:8883}  # MQTT Broker地址，格式: ssl://{endpoint}:8883
      device-id: ${HUAWEI_IOT_MQTT_DEVICE_ID:}  # 设备ID，例如: 6961b5c87f2e6c302f48db15_vihecle_001（可选，会从文件自动读取）
      device-secret: ${HUAWEI_IOT_MQTT_DEVICE_SECRET:}  # 设备密钥（用于生成动态密码）（可选，会从文件自动读取）
      device-key-path: ${HUAWEI_IOT_MQTT_DEVICE_KEY_PATH:e:/share/设备密钥}  # 设备密钥文件目录
      device-name: ${HUAWEI_IOT_MQTT_DEVICE_NAME:vihecle_001}  # 设备名称（用于匹配密钥文件），例如: vihecle_001, mobile_001, web_001
      instance-id: ${HUAWEI_IOT_MQTT_INSTANCE_ID:a494d922-ff97-4873-bd0c-2d6b1a72086d}  # 华为云IoT实例ID
      topic: ${HUAWEI_IOT_MQTT_TOPIC:/a494d922-ff97-4873-bd0c-2d6b1a72086d/6961b5c87f2e6c302f48db15_vihecle_001/user/location}  # 订阅主题，支持通配符（注意：不使用$oc前缀）
      qos: ${HUAWEI_IOT_MQTT_QOS:1}  # 服务质量等级 (0, 1, 2)
      connection-timeout: ${HUAWEI_IOT_MQTT_CONNECTION_TIMEOUT:30}  # 连接超时时间（秒）
      keep-alive: ${HUAWEI_IOT_MQTT_KEEP_ALIVE:60}  # 心跳间隔（秒）

# 百度地图配置
# ⚠️ 重要：使用服务端代理方式，AK不会暴露在前端
# 后端使用IP白名单（支持端口），前端通过后端代理调用百度地图API
baidu:
  map:
    ak: ${BAIDU_MAP_AK:}  # 百度地图AK（从环境变量读取）
    api:
      base-url: ${BAIDU_MAP_API_BASE_URL:https://api.map.baidu.com}  # 百度地图API基础URL
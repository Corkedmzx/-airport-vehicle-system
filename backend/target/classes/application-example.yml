# 应用配置示例文件
# 复制此文件为 application.yml 并修改为实际配置

spring:
  application:
    name: airport-vehicle-system
  
  profiles:
    active: dev
  
  main:
    allow-bean-definition-overriding: true
  
  # 数据源配置 - 使用环境变量
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:airport_vehicle_system}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:your-database-password}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      use-global-data-source-stat: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:your-druid-password}
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
  
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    defer-datasource-initialization: false
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfiguration
  
  websocket:
    path: /ws

  # 邮件配置
  # 重要：邮箱账号和授权码存储在数据库中，不在配置文件中
  # 系统会自动从数据库的sys_user表读取用户邮箱和授权码
  mail:
    enabled: true
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    from-name: ${MAIL_FROM_NAME:机场车辆系统}
    properties:
      mail:
        smtp:
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 30

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    swagger-model-name: 实体类列表
    enable-document-manage: true
    enable-version: true
  documents:
    - group: default
      name: 默认接口
      locations: /api/v3/api-docs

springdoc:
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.airport.controller

logging:
  level:
    com.airport: DEBUG
    org.springframework.beans: ERROR
    org.springframework.context: ERROR
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/airport-vehicle-system.log
    max-size: 100MB
    max-history: 30
  charset:
    console: UTF-8
    file: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true

# JWT配置 - 使用环境变量
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-change-this-in-production}
  expiration: 86400
  header: Authorization
  prefix: "Bearer "

# 华为云 IoTDA 多设备 MQTT（详见仓库文档）
huawei:
  iot:
    # 与控制台「转发目标」Token 相同；环境变量 HUAWEI_IOT_FORWARD_WEBHOOK_SECRET。华为默认用请求头 timestamp/nonce/signature 签名校验；亦支持调试用 X-IoT-Webhook-Token 明文。勿把真实值写入仓库
    forward-webhook-secret: "${HUAWEI_IOT_FORWARD_WEBHOOK_SECRET:}"
    mqtt:
      hardware-gps-device-ids: "${HUAWEI_HARDWARE_GPS_IDS:}"
      hardware-gps-subscribe-from-database: true
      hardware-gps-subscribe-oc-prefix: false
      # true：额外建立与 ESP 同身份的 MQTT 连接（默认 vehicle_002 密钥）；因华为通常不把本机上行投递给同身份订阅，实际上行仍由 vehicle_001 跨设备只读订阅（与小程序转发在代码中隔离）
      hardware-gps-dedicated-client: true
      hardware-gps-mqtt-client-name: vehicle_002

vehicle:
  tracking:
    update-interval: 30
    retention-days: 30
  gps:
    coordinate-system: GCJ02
    map-provider: baidu

dispatch:
  auto-assign: true
  task-timeout: 480
  max-retry: 3

map:
  provider: baidu
  baidu:
    ak: ${BAIDU_MAP_AK:}  # 百度地图AK（从环境变量读取，建议配置在.env文件中）
  gaode:
    key: ${GAODE_MAP_KEY:your-gaode-key}
  tencent:
    key: ${TENCENT_MAP_KEY:your-tencent-key}

upload:
  max-size: 100
  allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
  path: uploads/

system:
  page-size: 10
  export-max-rows: 10000
  maintenance-mode: false

# 安全：生产环境保持 expose-admin-endpoints=false；本地开发可设为 true 以访问 Swagger/Druid/Actuator
airport:
  security:
    expose-admin-endpoints: true
    cors-allowed-origin-patterns:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:8081
      - http://127.0.0.1:8081
